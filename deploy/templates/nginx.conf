# Managed by deploy/bootstrap.sh and deploy/deploy.sh — do not hand-edit the
# rendered file at /etc/nginx/sites-available/${APP_NAME}; edit this template
# instead and re-run deploy.sh (or bootstrap.sh) to re-render it.
#
# Rendered with: envsubst '${APP_NAME} ${APP_DIR} ${DOMAIN}' < nginx.conf > ...
# Only those three variables are substituted (see bootstrap.sh/deploy.sh) —
# every other "$..." below (Nginx's own request variables) is left literal.
#
# This is deliberately HTTP-only. `certbot --nginx -d ${DOMAIN}` (run by
# bootstrap.sh) edits the installed copy in place to add the 443 server
# block, the certificate directives, and the 80->443 redirect — see
# deploy/README.md. Re-rendering this file from the template later (a fresh
# deploy.sh run) will NOT remove certbot's edits: certbot's own renewal
# timer manages the certificate independently of this template.

upstream ${APP_NAME}_gunicorn {
    server unix:${APP_DIR}/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    client_max_body_size 10M;

    location /static/ {
        alias ${APP_DIR}/staticfiles/;
    }

    location / {
        proxy_pass http://${APP_NAME}_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
