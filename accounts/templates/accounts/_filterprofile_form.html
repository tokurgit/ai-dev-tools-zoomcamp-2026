{% load static %}
{% url 'filterprofile_create' as create_url %}
<form id="filterprofile-form"
      method="post"
      action="{{ form_action|default:create_url }}"
      hx-post="{{ form_action|default:create_url }}"
      hx-target="#filterprofile-form"
      hx-swap="outerHTML">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <p>
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </p>
  {% endfor %}
  <button type="submit">{{ submit_label|default:"Create profile" }}</button>
</form>
