[project]
name = "ai-dev-tools-zoomcamp-2026"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
# Coverage runs on every `uv run pytest`. --cov-fail-under is the repo-wide
# floor: raise it in later PRs, never lower it (issue #23).
addopts = "--cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["auctions", "config"]
omit = [
    "*/migrations/*",   # generated by Django, not hand-written logic
    "*/tests/*",        # the tests themselves
    "manage.py",        # Django's stock entry point
    "config/wsgi.py",   # deployment shim, not exercised by the suite
    "config/asgi.py",   # deployment shim, not exercised by the suite
]

[tool.coverage.report]
show_missing = true
skip_covered = false
